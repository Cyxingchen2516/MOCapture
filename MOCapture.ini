; ============================================================================
; MOCapture - 工程师自动占领 / 士兵自动进驻
; ============================================================================

[Capture]
Enable=1

; 热键 A: 选中的步兵各自找离自己最近的建筑, 目标互不重复
HotkeyA=Ctrl+E

; 热键 B: 选中的步兵全部去同一栋 (离队伍中心最近的)
HotkeyB=Ctrl+R

; 可选: 额外补充工程师类型 ID (内置已含 ENGINEER/SENGINEER/YENGINEER/FENGINEER)
EngineerTypes=

; 1=写 MOCapture.log
Log=1

